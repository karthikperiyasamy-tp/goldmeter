name: Fetch Gold News (Every 4 Hours)

on:
  schedule:
    # Runs every 6 hours at minute 0
    # 12 AM, 6 AM, 12 PM, 6 PM (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Fetch News from RSS Feeds
        run: |
          echo "🔄 Triggering news fetch..."
          curl -X GET https://goldmeter.in/api/fetch-news \
            -H "Content-Type: application/json" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5
        
      - name: Check Response
        run: echo "✅ News fetch job completed"

