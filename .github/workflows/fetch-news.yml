name: Fetch Gold News

on:
  schedule:
    # Runs every 6 hours
    # 12 AM, 6 AM, 12 PM, 6 PM (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: ${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: |
            ${{ runner.os }}-scripts-
      
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      
      - name: Run news fetcher
        working-directory: scripts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scrape-news.ts
      
      - name: Log completion
        run: echo "✅ News fetch completed at $(date -u)"
