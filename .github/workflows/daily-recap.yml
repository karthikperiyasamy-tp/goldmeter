name: Daily News Recap

on:
  schedule:
    # Run at 6:00 AM IST (00:30 UTC) every day
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Daily Recap Endpoint
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/daily-recap" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"

