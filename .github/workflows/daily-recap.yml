name: Daily News Recap

on:
  schedule:
    # Run at 6:00 AM IST (00:30 UTC) every day
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: ${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: |
            ${{ runner.os }}-scripts-
      
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      
      - name: Generate daily recap
        working-directory: scripts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx generate-recap.ts
      
      - name: Log completion
        run: echo "✅ Daily recap generation completed at $(date -u)"
