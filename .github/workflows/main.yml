name: Hourly Gold Rate Scraping

on:
  schedule:
    # IST window: 08:00–11:30 every 30 mins
    # 08:30 IST -> 03:00 UTC; 11:30 IST -> 06:00 UTC
    - cron: '30 2 * * *'    # 08:00 IST
    - cron: '0,30 3-5 * * *' # 08:30–11:30 IST
    - cron: '0 6 * * *'     # 11:30 IST
    # IST window: 12:00–19:00 once per hour (run at :30 UTC)
    # 12:00 IST -> 06:30 UTC; 19:00 IST -> 13:30 UTC
    - cron: '30 6-13 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Vercel Scraping Endpoint
        run: |
          curl -X POST https://goldmeter.in/api/admin/scrape-and-save \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
        
      - name: Check Response
        run: echo "Scraping job completed"
