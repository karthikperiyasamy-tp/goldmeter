name: Hourly Gold Rate Scraping

on:
  schedule:
    # ===== DAYTIME: 7 AM - 7 PM IST (hourly) =====
    # 7 AM - 9 AM IST (hourly)
    - cron: '30 1-3 * * *'
    
    # ===== MORNING WINDOW: 9:20 AM - 10:00 AM IST (every 10 mins) =====
    # This captures GoodReturns preliminary → final rate transition
    - cron: '50 3 * * *'     # 9:20 AM IST
    - cron: '0 4 * * *'      # 9:30 AM IST
    - cron: '10 4 * * *'     # 9:40 AM IST
    - cron: '20 4 * * *'     # 9:50 AM IST
    - cron: '30 4 * * *'     # 10:00 AM IST
    
    # 11 AM - 7 PM IST (hourly)
    - cron: '30 5-13 * * *'
    
    # ===== OVERNIGHT: 7 PM - 7 AM IST (every 2 hours) =====
    - cron: '30 15 * * *'    # 9:00 PM IST
    - cron: '30 17 * * *'    # 11:00 PM IST
    - cron: '30 19 * * *'    # 1:00 AM IST
    - cron: '30 21 * * *'    # 3:00 AM IST
    - cron: '30 23 * * *'    # 5:00 AM IST
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Vercel Scraping Endpoint
        run: |
          curl -X POST https://goldmeter.in/api/admin/scrape-and-save \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
        
      - name: Check Response
        run: echo "Scraping job completed"
