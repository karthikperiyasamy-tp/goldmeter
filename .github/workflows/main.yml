name: Gold Rate Scraping

on:
  schedule:
    # ===== OPTIMIZED SCHEDULE (reduced from ~23/day to ~12/day) =====
    
    # Morning window: 9:00 AM - 10:00 AM IST (every 15 mins)
    # Captures GoodReturns preliminary → final rate transition
    - cron: '30 3 * * *'      # 9:00 AM IST
    - cron: '45 3 * * *'      # 9:15 AM IST
    - cron: '0 4 * * *'       # 9:30 AM IST
    - cron: '15 4 * * *'      # 9:45 AM IST
    - cron: '30 4 * * *'      # 10:00 AM IST
    
    # Daytime: 11 AM - 7 PM IST (every 2 hours)
    - cron: '30 5 * * *'      # 11:00 AM IST
    - cron: '30 7 * * *'      # 1:00 PM IST
    - cron: '30 9 * * *'      # 3:00 PM IST
    - cron: '30 11 * * *'     # 5:00 PM IST
    - cron: '30 13 * * *'     # 7:00 PM IST
    
    # Overnight: 9 PM - 7 AM IST (every 4 hours)
    - cron: '30 15 * * *'     # 9:00 PM IST
    - cron: '30 19 * * *'     # 1:00 AM IST
    
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: ${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: |
            ${{ runner.os }}-scripts-
      
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      
      - name: Run gold rate scraper
        working-directory: scripts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scrape-gold-rates.ts
      
      - name: Log completion
        run: echo "✅ Gold rate scraping completed at $(date -u)"
